  m4_hourly:         {zenodo: 4656589, file: m4_hourly_dataset.tsf,                         horizon: 48,  seasonality: 24,  max_series: 414}
  m4_weekly:         {zenodo: 4656522, file: m4_weekly_dataset.tsf,                         horizon: 13,  seasonality: 1,   max_series: 359}
  tourism_monthly:   {zenodo: 4656096, file: tourism_monthly_dataset.tsf,                   horizon: 24,  seasonality: 12,  max_series: 366}
  tourism_quarterly: {zenodo: 4656093, file: tourism_quarterly_dataset.tsf,                 horizon: 8,   seasonality: 4,   max_series: 427}
  nn5_daily:         {zenodo: 4656117, file: nn5_daily_dataset_without_missing_values.tsf,  horizon: 56,  seasonality: 7,   max_series: 111}
