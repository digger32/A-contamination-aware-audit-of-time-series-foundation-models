# Monash suite. Zenodo record ids VERIFIED against forecastingdata.org on 2026-07-21.
# horizon/seasonality follow the Monash archive experiment conventions
# (rakshitha123/TSForecasting, experiments/fixed_horizons); cross-check at Stage 0
# via scripts/download_data.py --check, which also verifies each record resolves.
# max_series: seeded random cap so classical baselines fit 32 cores / 32 GB RAM;
# identical subset is used by EVERY model (enforced by the eval_hash gate check).
suite: monash
license: CC-BY-4.0
datasets:
  m3_monthly:        {zenodo: 4656298, file: m3_monthly_dataset.tsf,                        horizon: 18,  seasonality: 12,  max_series: 500}
